<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>好友申请时间筛选·正式交互切片</title><link rel="stylesheet" href="admin-content.css">
<style>body{font:14px Arial,sans-serif;color:#606266;margin:32px;background:white}h1{font-size:18px;color:#303133}p{color:#909399}form{background:#f8f9fa;padding:20px;display:flex;gap:18px;align-items:end;flex-wrap:wrap}label{display:block;margin-bottom:8px}input,select,button{height:32px;border:1px solid #dcdfe6;border-radius:4px;background:white;color:#606266;padding:0 9px}button{cursor:pointer}.primary{background:#00c4af;color:white;border-color:#00c4af}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:14px;border-bottom:1px solid #ebeef5}th{background:#fafafa}#notice{min-height:22px;color:#f56c6c;margin-top:14px}small{color:#909399}.toolbar{margin-top:20px;display:flex;gap:12px;align-items:center}</style>
<h1>好友列表 · 申请时间筛选</h1><nav><a href="_shell.html?tenant=bzds&page=customerManagement">原普通列表</a> · <a href="_shell.html?tenant=yestar-sz&page=yxCustomerList">原艺星列表</a></nav><p>正式合同的局部交互切片 / 全部为合成数据。沿用现有管理页颜色与控件尺寸；正式实现放回原页面，不替换整页布局。</p>
<form id="filters"><div><label>所在账号</label><select id="account"><option value="">全部</option><option>账号一</option><option>账号二</option></select></div><div><label>申请时间（北京时间）</label><input type="date" id="start"> 至 <input type="date" id="end"></div><div><label>添加时间（北京时间）</label><input type="date" id="addStart"> 至 <input type="date" id="addEnd"></div><button class="primary">执行筛选</button><button type="button" id="reset">重置</button></form>
<div class="toolbar"><b id="count"></b><button id="export">导出当前筛选结果</button><button id="failure">演示查询失败</button></div><div id="notice" role="alert"></div><table><thead><tr><th>好友</th><th>所在账号</th><th>申请时间</th><th>添加时间</th></tr></thead><tbody id="rows"></tbody></table><p>示例：筛选 2026-11-20，包含当日 00:00:00 和 23:59:59；未知申请时间不入选。同一好友在两个账号下分别判断。</p>
<script>
const data=[['合成好友一','账号一','2026-11-20 00:00:00','2026-11-21 09:00:00'],['合成好友一','账号二','2026-11-22 10:00:00','2026-11-22 10:05:00'],['合成好友二','账号一','2026-11-20 23:59:59','2026-11-21 08:00:00'],['合成好友三','账号一',null,'2026-11-20 12:00:00'],['合成好友四','账号一','2026-11-19 23:59:59','2026-11-20 10:00:00']];
const el=id=>document.getElementById(id);let current=data.slice(), failed=false;
function draw(){el('rows').replaceChildren();for(const row of current){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value||'—';tr.append(td)}el('rows').append(tr)}if(!current.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.textContent='暂无符合条件的好友';tr.append(td);el('rows').append(tr)}el('count').textContent=`共 ${current.length} 条`;el('export').disabled=failed;}
function range(value,start,end){return (!start&&!end)||!!value&&(!start||value.slice(0,10)>=start)&&(!end||value.slice(0,10)<=end)}
el('filters').onsubmit=e=>{e.preventDefault();const s=el('start').value,t=el('end').value,a=el('addStart').value,b=el('addEnd').value;if((!!s!==!!t)||(!!a!==!!b)){el('notice').textContent='请选择完整的开始日期和结束日期';return}if(s>t||a>b){el('notice').textContent='开始日期不能晚于结束日期';return}failed=false;el('notice').textContent='';current=data.filter(r=>(!el('account').value||r[1]===el('account').value)&&range(r[2],s,t)&&range(r[3],a,b));draw()};
el('reset').onclick=()=>{el('filters').reset();failed=false;current=data.slice();el('notice').textContent='';draw()};el('failure').onclick=()=>{failed=true;el('notice').textContent='查询失败，保留上次成功结果，请重新执行筛选。';draw()};
el('export').onclick=()=>{const csv='\ufeff'+[['好友','所在账号','申请时间','添加时间'],...current].map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='好友筛选合成演示.csv';a.click();URL.revokeObjectURL(url)};draw();
</script></html>
