  function settingsPage(){if(!draft)draft=clone(state.config);const tabs=[['metrics','统计指标'],['dimensions','质检维度'],['parameters','判定参数'],['products','产品目录']];return `<div class="q-breadcrumb">AI 管理 / 质检规则与指标</div><div class="q-title-row"><div><h1>质检规则与指标</h1><div class="q-sub">当前租户：演示企业 · 配置 v${state.config.version}</div></div><div class="q-actions">${button('返回日报','back-report')}${button('保存配置','save-config',{},'primary')}${button('保存并预览','save-config',{preview:'yes'})}</div></div>${notice?`<div class="q-toast" role="status">${esc(notice)}</div>`:''}<div class="q-notice"><span id="q-draft-notice">${draftDirty()?'有未保存修改 · 切换页面会保留，刷新前请保存。':'显示设置即时生效；判定规则用于新分析，历史结果保留原标准。'}</span>${draftDirty()?button('放弃本次修改','discard-config',{},'link'):''}</div><div class="q-tabs" role="tablist" aria-label="质检配置">${tabs.map(([id,name])=>`<button type="button" class="q-tab cursor-interaction ${state.settingsTab===id?'active':''}" role="tab" aria-selected="${state.settingsTab===id}" aria-controls="q-config-content" data-action="settings-tab" data-value="${id}">${name}</button>`).join('')}</div><div id="q-config-content" role="tabpanel">${state.settingsTab==='metrics'?metricSettings():state.settingsTab==='dimensions'?dimensionSettings():state.settingsTab==='parameters'?parameterSettings():productSettings()}</div>`;}

  root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||!root.contains(b))return;if(b.dataset.action==='overlay-close'&&e.target!==b)return;doAction(b.dataset.action,b.dataset);});

  root.addEventListener('keydown',e=>{if(e.key==='Tab'&&modal){const controls=Array.from(root.querySelectorAll('#q-modal button,#q-modal input,#q-modal select,#q-modal textarea')).filter(x=>!x.disabled);const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.key==='Escape'&&modal){closeModal();}if(e.key==='Enter'&&e.target.name==='search'){e.preventDefault();doAction('search',{});}});
  let metricDrag = null;
  function finishMetricDrag(commit) {
