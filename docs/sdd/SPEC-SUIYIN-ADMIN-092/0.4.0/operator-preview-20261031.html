<script>
(() => {
  const root = document.getElementById('quality-ops-rules');
  const $ = s => root.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const copy = x => JSON.parse(JSON.stringify(x));
  let optionSequence = 0;
  const optionId = () => 'choice-'+Date.now()+'-'+(++optionSequence);
  const ensureOptionIds = item => {if(item.kind==='category')item.options=(item.options||[]).map((o,i)=>({...o,id:o.id||'choice-'+(item.id||'draft')+'-'+i}));return item;};
  const templates = [
    {key:'progress-clarity',name:'处理进度说明不清',kind:'problem',standard:'员工表示事项正在处理中，但没有说明后续如何反馈或何时会有下一步消息，客户无法知道后续安排。',exclude:'事项已处理完成；员工已明确后续反馈方式或时间；当前无需后续处理。',yes:'客户：后续谁跟我反馈？\n员工：在处理了，再等等。没有说明反馈安排。',no:'员工：已提交退款，明天下午由我向您反馈审批进度。',attention:'重点关注',redline:false,redlineText:'',industry:'通用',enabled:true},
    {key:'interaction',name:'咨询回应缺少针对性',kind:'problem',standard:'客户已表达具体需求或持续提问，员工仍机械应答、答非所问，没有针对客户的问题展开解释。',exclude:'客户没有实质咨询；员工已有针对性解释、追问或回应。',yes:'客户多次询问适合自己的方案，员工只重复“来店看看”，没有回应顾虑。',no:'员工结合客户的需求说明适用条件，并追问影响选择的具体情况。',attention:'一般关注',redline:false,redlineText:'',industry:'通用',enabled:true},
    {key:'promise',name:'医疗效果保证话术',kind:'problem',standard:'员工对医疗效果作无条件保证，或使用零风险、永久有效、保证根治等绝对表述；需要结合完整上下文核实。',exclude:'客户自行提出保证要求；员工明确说明效果因人而异、存在风险；仅引用并否定不当说法。',yes:'员工：这个治疗保证根治，绝对不会有任何风险。',no:'客户：能保证效果吗？\n员工：效果因人而异，需要医生评估，也存在相应风险。',attention:'重点关注',redline:true,redlineText:'有真实员工发言支持无条件效果保证或零风险宣称，结合语境后仍成立。',industry:'医美行业',enabled:true},
    {key:'budget',name:'客户提到的预算',kind:'number',standard:'记录客户在本次会话中明确表达的预算；出现多个数值时采用最后一次明确确认的预算，不把员工报价当成客户预算。',exclude:'客户没有明确预算；仅出现员工报价或无关金额。',yes:'客户：我最多能接受五千元。 → 5000 元',no:'员工：这个产品五千元。 → 客户预算未提及',unit:'元',min:0,max:1000000,attention:'一般关注',redline:false,redlineText:'',industry:'通用',enabled:true},
    {key:'goal',name:'本次咨询目的',kind:'category',standard:'依据客户本次明确表达的主要目的分类；同时涉及多项目的时，以客户最后确认需要处理的事项为准。',exclude:'没有足够客户发言时保留“暂无法判断”，不猜测。',yes:'客户：我想约下周三到店。 → 预约',no:'只有员工发活动通知、客户未表达目的。 → 暂无法判断',options:[{name:'预约',when:'客户明确提出或确认到店安排'},{name:'价格咨询',when:'客户主要询问费用、优惠或预算'},{name:'售后',when:'客户主要提出治疗后的问题或处理诉求'}],attention:'一般关注',redline:false,redlineText:'',industry:'通用',enabled:true}
  ];
  const blank = kind => ({name:'',kind,standard:'',exclude:'',yes:'',no:'',attention:'一般关注',redline:false,redlineText:'',industry:'自定义',enabled:true,unit:'',min:'',max:'',precision:0,options:[{id:optionId(),name:'',when:''}]});

    if(s.tab==='redline'){const filtered=rows.filter(x=>x.redline===s.redline);return '<section class="qo-panel"><h2>红线候选与人工认定</h2><p class="qo-sub">红线有单独判定标准。重点关注不自动等于红线，候选必须人工核实。</p><div class="qo-kind">'+['候选','已认定','已排除'].map(x=>'<button class="qo-button cursor-interaction" data-redline-scope="'+x+'" aria-pressed="'+String(s.redline===x)+'">'+(x==='候选'?'待核实候选':x)+' '+rows.filter(r=>r.redline===x).length+'</button>').join('')+'</div>'+reportRowsHTML(filtered,true)+'</section>';}

    return '<section class="qo-panel"><h2>本次日报使用的检查标准</h2><p class="qo-sub">生成时保存的标准，仅供查阅。当前配置变化不会改写这份历史日报。</p>'+templates.slice(0,2).map(t=>'<article class="qo-report-row"><h3>'+esc(t.name)+'</h3><p style="margin-top:7px">'+esc(t.standard)+'</p><p class="qo-sub">不计入：'+esc(t.exclude)+'</p></article>').join('')+'<article class="qo-report-row"><h3>回复与互动</h3><p>回复超时20分钟；连续消息合并间隔5分钟；深聊参考客户发言6条。</p></article><article class="qo-report-row"><h3>红线候选标准</h3><p>有明确工作号发言作未经核实的无条件承诺，或拒绝已约定的跟进事项；须结合上下文和企业授权要求人工核实。</p><p class="qo-sub">客户提问、员工引用并否定的说法不能直接认定。</p></article><button class="qo-link cursor-interaction" data-nav="rules">前往当前检查标准设置</button></section>';}
  function emptyReportRows(){return '<p class="qo-muted" style="padding:18px 0">当前筛选下没有匹配的会话。可调整部门、工作号或查看范围。</p>';}
  function reportRowsHTML(rows,actions){return rows.length?rows.map(x=>'<article class="qo-report-row"><div class="qo-row"><h3>'+esc(x.issue||(x.state==='failed'?'分析失败，尚无结论':x.state==='skipped'?'未达到本次分析条件':'未发现本次标准内问题'))+'</h3>'+(actions?'<button class="qo-button cursor-interaction" data-open-report-detail="'+x.id+'">'+(x.state==='analyzed'?'查看并处理':'查看原因与原文')+'</button>':'')+'</div><p class="qo-report-meta"><span>工作号：'+esc(x.account)+'</span><span>客户：'+esc(x.customer)+'</span><span>'+esc(x.department)+'</span></p><p class="qo-report-reason"><strong>判断理由：</strong>'+esc(x.reason)+'</p><div class="qo-report-meta"><span>关注程度：'+esc(x.attention||'尚未判断')+'</span><span>人工复核：'+esc(x.review)+'</span><span>处理进度：'+esc(x.follow||'暂无需处理结论')+'</span>'+(x.redline!=='无'?'<span class="qo-pill qo-caution">红线'+esc(x.redline)+'</span>':'')+'</div></article>').join(''):emptyReportRows();}
  function renderReportDetail(){const s=rs(),x=allReportRows().find(r=>r.id===s.detail);if(!x){s.detail=null;renderReport();return;}$('#qo-content').innerHTML='<button class="qo-link cursor-interaction" data-report-action="back-list">← 返回原列表（保留筛选）</button><section class="qo-panel"><p class="qo-sub">'+s.date+' · '+esc(x.account)+' · '+esc(x.customer)+'</p><h2>'+esc(x.issue||(x.state==='failed'?'尚未形成分析结论':x.state==='skipped'?'暂无可分析内容':'本次未发现问题'))+'</h2><p class="qo-report-reason"><strong>判断理由：</strong>'+esc(x.reason)+'</p><p class="qo-report-meta">关注程度：'+esc(x.attention||'未判断')+' · 人工复核：'+esc(x.review)+' · 跟进：'+esc(x.follow||'尚无结论')+(x.redline!=='无'?' · 红线状态：'+esc(x.redline):'')+'</p>'+(x.issue?'<div class="qo-report-detail-grid"><div class="qo-example"><h3>人工复核：判断是否成立</h3><label class="qo-field">复核结论<select class="qo-input" id="qo-review-result"><option value="确认问题" '+(x.review==='确认问题'?'selected':'')+'>确认问题</option><option value="已排除" '+(x.review==='已排除'?'selected':'')+'>排除：不成立／误报</option><option value="待复核" '+(x.review==='待复核'?'selected':'')+'>暂无法判断，保留待复核</option></select></label>'+(x.redline!=='无'?'<label class="qo-field">红线认定<select class="qo-input" id="qo-review-redline">'+['候选','已认定','已排除'].map(r=>'<option '+(r===x.redline?'selected':'')+'>'+r+'</option>').join('')+'</select></label>':'')+'<label class="qo-field">复核说明（必填）<textarea class="qo-input" id="qo-review-note" placeholder="例如：已核对上下文，员工已回答客户的问题。"></textarea></label><button class="qo-button cursor-interaction" style="margin-top:10px" data-report-action="review">更新复核（仅演示）</button></div><div class="qo-example"><h3>后续跟进：记录处理到哪一步</h3><label class="qo-field">处理进度<select class="qo-input" id="qo-follow-result">'+['待跟进','跟进中','已处理','无需跟进'].map(r=>'<option '+(r===x.follow?'selected':'')+'>'+r+'</option>').join('')+'</select></label><label class="qo-field">处理备注<span class="qo-sub">选填，仅保留在本次演示内存</span><input class="qo-input" id="qo-follow-note" value="'+esc(x.note||'')+'" placeholder="例如：已联系客户，等待售后反馈"></label><button class="qo-button cursor-interaction" style="margin-top:10px" data-report-action="follow">更新处理进度（仅演示）</button></div></div>':'<p class="qo-caution-note">没有可复核结论时不提供确认按钮，避免把分析失败当作“没问题”。</p>')+'<div id="qo-detail-feedback" class="qo-note" aria-live="polite" hidden></div></section><section class="qo-panel"><div class="qo-row"><h2>已定位的会话原文</h2><span class="qo-pill">高亮：本问题对应消息</span></div><p class="qo-sub">以下均为合成会话。判断理由是分析摘要，消息气泡才是原文；头像使用演示标识。</p>'+x.messages.map(([side,text,time,highlight,type])=>'<div class="qo-chat '+(side==='staff'?'qo-out':'')+'"><span class="qo-avatar" aria-label="'+(side==='staff'?'工作号':'客户')+'演示头像">'+(side==='staff'?'工作号':'客户')+'</span><div class="qo-chat-body"><p class="qo-sub">'+esc(side==='staff'?x.account:x.customer)+' · '+time+'</p><div class="qo-bubble '+(highlight?'qo-evidence':'')+'">'+esc(text)+(type==='image'?'<p class="qo-sub">仅保留消息类型，没有进行图片识别。</p>':'')+'</div></div></div>').join('')+'<p class="qo-sub">按工作号展示接待归属；没有可靠操作记录时，不推断消息由哪位员工发送。</p></section>';}
  function renderReportPanel(){const s=rs();$('#qo-content').innerHTML='<button class="qo-link cursor-interaction" data-report-action="back-records">← 返回日报</button><section class="qo-panel"><div class="qo-row"><h2>'+(s.panel==='management'?'生成管理':'生成记录')+'</h2>'+(s.panel!=='management'?'<button class="qo-button cursor-interaction" data-report-action="management">生成管理</button>':'')+'</div>'+(s.panel==='management'?'<p class="qo-caution-note">只读演示：本面板不提交请求，不操作定时开关，不调用模型，也不改写统计。</p><article class="qo-report-row"><h3>继续处理本次未完成会话</h3><p class="qo-sub">用于已存在的失败或待恢复任务，沿公共 AI Task 判断回执与是否需要再次发送。</p><button class="qo-button" disabled>付费分析操作未开放</button></article><article class="qo-report-row"><h3>按当前标准重新分析</h3><p class="qo-sub">会生成新分析记录并可能产生费用，正式产品需明确日期、工作号范围和费用边界。</p><button class="qo-button" disabled>本演示不发起分析</button></article><article class="qo-report-row"><h3>仅重新汇总已有结果</h3><p class="qo-sub">不调用模型，只在已有事实支持范围内重新统计；缺失结论仍保持未知。</p><button class="qo-button" disabled>本演示不提交统计重算</button></article>':'<p class="qo-sub" style="margin-top:8px">只读合成记录，记录分析完成情况；自动生成开关另在对应提示词模板中。</p><div class="qo-report-table-wrap"><table class="qo-report-table"><thead><tr><th>统计日</th><th>状态</th><th>分析进度</th><th>说明</th></tr></thead><tbody><tr><td>2026-10-30</td><td>尚未启动</td><td>未分析</td><td>自动生成已暂停</td></tr><tr><td>2026-10-29</td><td>部分完成</td><td>'+allReportRows().filter(x=>x.state==='analyzed').length+' 个已分析</td><td>1个分析失败，1个因内容不足跳过</td></tr></tbody></table></div>')+'</section>';}
  function handleReportClick(b){const s=rs();if(b.dataset.reportTab){s.tab=b.dataset.reportTab;s.detail=null;renderReport();return true;}if(b.dataset.reportDrill){const key=b.dataset.reportDrill;if(key==='redline'){s.tab='redline';s.redline='候选';}else{s.tab='issues';s.filter=key;}renderReport();return true;}if(b.dataset.redlineScope){s.redline=b.dataset.redlineScope;renderReport();return true;}if(b.dataset.openReportDetail){s.detail=b.dataset.openReportDetail;renderReport();return true;}if(b.dataset.reportAccountDrill){s.account=b.dataset.reportAccountDrill;s.tab='issues';s.filter='all';renderReport();return true;}if(b.dataset.reportProduct){$('#qo-product-report-detail').innerHTML=reportRowsHTML(scopedReportRows().filter(x=>x.product===b.dataset.reportProduct),true);return true;}const a=b.dataset.reportAction;if(!a)return false;if(a==='records'){s.panel='records';s.detail=null;}if(a==='management')s.panel='management';if(a==='back-records')s.panel=null;if(a==='close-options')s.options=false;if(a==='back-list')s.detail=null;if(a==='review'||a==='follow'){const x=allReportRows().find(r=>r.id===s.detail);if(!x)return true;if(a==='review'){const note=$('#qo-review-note').value.trim();if(!note){const box=$('#qo-detail-feedback');box.hidden=false;box.textContent='请简要填写复核说明，再更新复核。';return true;}const review=$('#qo-review-result').value,redline=$('#qo-review-redline')?.value;if(redline==='已认定'&&review!=='确认问题'){const box=$('#qo-detail-feedback');box.hidden=false;box.textContent='认定红线前，请先把复核结论设为“确认问题”。两者不能互相冲突。';return true;}if(redline==='已排除'&&review==='确认问题'){const box=$('#qo-detail-feedback');box.hidden=false;box.textContent='普通问题可以成立但排除红线；本演示保留普通问题确认，单独排除红线。';}x.review=review;x.reviewNote=note;if(redline)x.redline=review==='已排除'?'已排除':redline;}else{x.follow=$('#qo-follow-result').value;x.note=$('#qo-follow-note').value.trim();}renderReportDetail();const box=$('#qo-detail-feedback');box.hidden=false;box.textContent=a==='review'?'复核结果已在演示内存中更新。跟进状态未自动改变，没有提交到真实系统。':'处理进度已在演示内存中更新。人工复核结论未改变，没有提交到真实系统。';return true;}renderReport();return true;}
  function showPrompt(){requestNav(()=>{pageView='rules';setChrome('rules');mode='list';$('#qo-content').innerHTML='<section class="qo-panel"><h2>AI 提示词库</h2><p class="qo-muted" style="margin-top:10px">企微、个微日报的提示词、绑定模型和定时开关继续在各自现有模板中维护。</p><div class="qo-list"><div class="qo-product"><strong>企微会话质检日报</strong><span class="qo-muted">定时开关：本演示不操作生产配置</span></div><div class="qo-product"><strong>个微会话质检日报</strong><span class="qo-muted">定时开关：本演示不操作生产配置</span></div></div><button class="qo-button cursor-interaction" data-action="back-checks">返回检查项目</button></section>';updateState();});}
  root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.action;
    if(b.dataset.tab){navigate(b.dataset.tab);return;}if(b.dataset.nav==='prompt'){showPrompt();return;}if(b.dataset.nav==='rules'){navigate('checks');return;}if(b.dataset.nav==='report'){openReport(b.dataset.channel);return;}
    if(pageView==='report'){if(b.id==='qo-view-options'){rs().options=!rs().options;renderReport();return;}if(b.id==='qo-generation-records'){rs().panel='records';rs().detail=null;renderReport();return;}if(handleReportClick(b))return;}
    if(a==='keep-editing'){$('#qo-guard').hidden=true;pending=null;return;}if(a==='discard-editor'){const fn=pending;pending=null;editor=null;metricEditor=null;$('#qo-guard').hidden=true;fn?.();return;}
    if(a==='library'){selectedTemplates.clear();mode='library';renderChecks();return;}if(a==='custom'){openEditor(blank('problem'),-1);return;}if(a==='back-checks'){requestNav(()=>{tab='checks';mode='list';render();});return;}
    if(a==='add-selected'){selectedTemplates.forEach(i=>draft.items.push(ensureOptionIds({...copy(templates[i]),id:'demo-'+Date.now()+'-'+i})));toast('已添加所选检查项目，可继续修改；点击顶部“保存配置”后用于后续分析。');selectedTemplates.clear();mode='list';render();mark();return;}
    if(b.dataset.edit!==undefined){const i=Number(b.dataset.edit);openEditor(draft.items[i],i);return;}if(b.dataset.copy!==undefined){const x=copy(draft.items[Number(b.dataset.copy)]);delete x.key;x.name+='（副本）';delete x.id;openEditor(x,-1);return;}
    if(b.dataset.remove!==undefined){const i=Number(b.dataset.remove),item=draft.items[i],references=draft.metrics.filter(m=>m.sourceKey===item.id||m.sourceKey?.startsWith(item.id+':option:'));if(references.length){toast('这项检查被展示指标“'+references.map(m=>m.name).join('、')+'”引用，请先到日报展示指标中移除关联指标；只取消显示仍会保留引用。');return;}draft.items.splice(i,1);renderChecks();mark();toast('已从待保存配置移除，历史结果保留。');return;}
    if(b.dataset.kind){const current=readEditor();editor={...blank(b.dataset.kind),name:current.name,standard:current.standard,exclude:current.exclude,yes:current.yes,no:current.no};renderEditor();return;}
    if(a==='add-option'){editor=readEditor();if(editor.options.length>=32){$('#qo-editor-error').textContent='最多支持32个业务类别。';return;}editor.options.push({id:optionId(),name:'',when:''});$('#qo-options').innerHTML=editor.options.map(optionHTML).join('');return;}if(b.dataset.removeOption!==undefined){editor=readEditor();const at=Number(b.dataset.removeOption),choice=editor.options[at],references=draft.metrics.filter(m=>m.sourceKey===editor.id+':option:'+choice.id);if(references.length){$('#qo-editor-error').textContent='这个类别被展示指标“'+references.map(m=>m.name).join('、')+'”引用，请先移除关联指标。';return;}editor.options.splice(at,1);$('#qo-options').innerHTML=editor.options.map(optionHTML).join('');return;}
    if(a==='save-item'){const x=readEditor(),err=validateItem(x);if(err){$('#qo-editor-error').textContent=err;return;}if(x.kind==='number'){x.min=x.min===''?null:Number(x.min);x.max=x.max===''?null:Number(x.max);}if(editorIndex<0){x.id='demo-'+Date.now();draft.items.push(x);}else draft.items[editorIndex]=x;editor=null;mode='list';render();mark();toast('检查项目已加入待保存配置。点击顶部“保存配置”后生效。');return;}
    if(a==='add-product'){draft.products.push({name:'',aliases:''});renderProducts();mark();return;}if(b.dataset.removeProduct!==undefined){draft.products.splice(Number(b.dataset.removeProduct),1);renderProducts();mark();return;}
    if(b.dataset.removeMetric!==undefined){draft.metrics.splice(Number(b.dataset.removeMetric),1);renderMetrics();mark();toast('展示指标已移除。保存配置后生效，历史结果保留。');return;}if(a==='add-metric'){openMetricEditor();return;}if(b.dataset.editMetric!==undefined){openMetricEditor(Number(b.dataset.editMetric));return;}if(a==='back-metrics'){requestNav(()=>{tab='metrics';render();});return;}
    if(a==='save-metric'){const x=readMetricEditor(),s=metricSources().find(y=>y.key===x.sourceKey);if(!x.name){$('#qo-metric-error').textContent='请填写指标名称。';return;}if(!s){$('#qo-metric-error').textContent='这个检查项目已不可用，请重新选择。';return;}if(draft.metrics.some((m,i)=>i!==x.index&&m.name===x.name)){$('#qo-metric-error').textContent='已有同名指标，请换一个名称。';return;}const m={id:x.index<0?'metric-'+Date.now():draft.metrics[x.index].id,name:x.name,source:s.label,sourceKey:s.key,sourceKind:s.kind,option:s.option,unit:s.item.unit,mode:x.mode,denominator:x.denominator,value:s.kind==='number'?({sum:32000,average:4000,maximum:8000,minimum:2000}[x.mode]||4000):8,total:s.kind==='number'?null:x.denominator==='included'?40:32,enabled:true,card:true};if(x.index<0)draft.metrics.push(m);else draft.metrics[x.index]=m;metricEditor=null;renderMetrics();mark();toast('展示指标已加入待保存配置。可拖动调整顺序；不会额外调用模型。');return;}
    if(b.id==='qo-save'){if(draft.products.some(x=>!x.name.trim())){tab='products';mode='list';render();$('#qo-product-error').textContent='请为新增产品填写名称，或移除空白项。';return;}const p=draft.params;if(!Number.isInteger(Number(p.reply))||p.reply<1||p.reply>1440||!Number.isInteger(Number(p.deep))||p.deep<1||p.deep>1000||!Number.isInteger(Number(p.group))||p.group<1||p.group>60){tab='response';render();$('#qo-param-error').textContent='请填写有效整数：回复超时1–1440分钟，深聊参考1–1000次，连续消息合并间隔1–60分钟。';return;}saved=copy(draft);updateState();persist();toast('演示配置已保存。'+draft.items.filter(x=>x.enabled).length+'个项目参与后续分析；历史标准保留。本操作没有调用模型。');return;}
    if(b.id==='qo-revert'){requestNav(()=>{draft=copy(saved);mode='list';render();persist();toast('已恢复为上次保存的演示配置。');});}
  });
  root.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.reportField){rs()[t.dataset.reportField]=t.value;rs().detail=null;renderReport();return;}if(t.id==='qo-metric-source'){metricEditor=readMetricEditor();const source=metricSources().find(x=>x.key===t.value);if(!source){metricEditor=null;renderMetrics();updateState();toast('所选检查来源已不可用，请返回确认原检查项目。');return;}metricEditor.mode=source.kind==='number'?'average':'count';metricEditor.name=source.label+(source.kind==='number'?'平均值':'会话数');renderMetricEditor();return;}if(t.id==='qo-metric-calculation'){$('#qo-denominator-field')?.toggleAttribute('hidden',t.value!=='ratio');return;}if(t.dataset.toggleItem!==undefined){draft.items[Number(t.dataset.toggleItem)].enabled=t.checked;renderChecks();mark();return;}if(t.dataset.template!==undefined){const i=Number(t.dataset.template);t.checked?selectedTemplates.add(i):selectedTemplates.delete(i);$('#qo-add-selected').disabled=!selectedTemplates.size;$('#qo-add-selected').textContent='添加所选 '+selectedTemplates.size+' 项';return;}if(t.id==='qo-redline'){$('#qo-redline-field').hidden=!t.checked;return;}if(t.dataset.metricEnabled!==undefined){draft.metrics[Number(t.dataset.metricEnabled)].enabled=t.checked;renderMetrics();mark();return;}if(t.dataset.metricCard!==undefined){draft.metrics[Number(t.dataset.metricCard)].card=t.checked;renderMetrics();mark();return;}if(t.dataset.metricMode!==undefined){const m=draft.metrics[Number(t.dataset.metricMode)];m.mode=t.value;if(m.sourceKind==='number')m.value=({sum:32000,average:4000,maximum:8000,minimum:2000})[t.value];renderMetrics();mark();return;}});
  root.addEventListener('input',ev=>{const t=ev.target;const mapping={'qo-reply':'reply','qo-deep':'deep','qo-group':'group'};if(mapping[t.id]){draft.params[mapping[t.id]]=t.value;mark();}if(t.dataset.productName!==undefined){draft.products[Number(t.dataset.productName)].name=t.value;mark();}if(t.dataset.productAliases!==undefined){draft.products[Number(t.dataset.productAliases)].aliases=t.value;mark();}});
  root.addEventListener('dragstart',ev=>{const r=ev.target.closest('[data-metric-row]');if(!r)return;dragged=Number(r.dataset.metricRow);r.classList.add('qo-dragging');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(dragged));});
  root.addEventListener('dragover',ev=>{if(ev.target.closest('[data-metric-row]'))ev.preventDefault();});
  root.addEventListener('drop',ev=>{const r=ev.target.closest('[data-metric-row]');if(!r||dragged<0)return;ev.preventDefault();const to=Number(r.dataset.metricRow);const [m]=draft.metrics.splice(dragged,1);draft.metrics.splice(to,0,m);dragged=-1;renderMetrics();mark();toast('指标展示顺序已调整，预览已同步。');});
  root.addEventListener('dragend',()=>{dragged=-1;root.querySelectorAll('.qo-dragging').forEach(x=>x.classList.remove('qo-dragging'));});
  root.addEventListener('keydown',ev=>{const b=ev.target.closest('[data-grip]');if(!b||!['ArrowUp','ArrowDown'].includes(ev.key))return;ev.preventDefault();const i=Number(b.dataset.grip),j=i+(ev.key==='ArrowUp'?-1:1);if(j<0||j>=draft.metrics.length)return;[draft.metrics[i],draft.metrics[j]]=[draft.metrics[j],draft.metrics[i]];renderMetrics();root.querySelector('[data-grip="'+j+'"]').focus();mark();toast('指标展示顺序已调整。');});
  window.addEventListener('openai:set_globals',ev=>{if(!editor&&!metricEditor){hydrate(ev.detail?.globals?.widgetState);render();}});
  render();
})();
</script>
