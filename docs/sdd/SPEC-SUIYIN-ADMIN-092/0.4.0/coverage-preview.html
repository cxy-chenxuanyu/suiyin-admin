<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日报覆盖状态示例</title><style>body{font:15px system-ui;color:#334155;background:#f4f7fa;margin:32px}main{max-width:1050px;margin:auto}section{background:white;padding:24px;border:1px solid #e2e8f0;border-radius:6px;margin:18px 0}button{background:white;border:1px solid #dce4ed;padding:10px 16px;margin-right:8px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#128f83;color:white}#notice{background:#eaf7f4;padding:16px}.counts{display:flex;gap:24px;flex-wrap:wrap}.counts strong{display:block;font-size:25px;margin:8px 0}small{color:#64748b}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border-bottom:1px solid #e2e8f0;padding:12px;text-align:left}</style><main><small>聊天管理 / 企微·个微质检日报 · 0.4.0调整候选</small><h1>日报覆盖与生成进度</h1><p>独立合成示例，不调用API或模型；原七模块、筛选和证据界面继续沿用已确认原型。</p><section><button data-mode="mixed">混合准入</button><button data-mode="skipped">全部未达门槛</button><button data-mode="collecting">取数未完成</button><button data-mode="previous">显示上一可读版</button><p id="notice" role="status"></p><div id="counts" class="counts"></div><p id="metrics"></p></section><section><h2>最新生成记录</h2><table><thead><tr><th>修订 / 状态</th><th>覆盖进度</th><th>原因</th></tr></thead><tbody id="run"></tbody></table><p><small>未达门槛保留程序统计；未分析、失败和暂停不表示低风险或0问题。图片/视频识别本轮不增加。</small></p></section></main><script>const samples={mixed:{notice:'本次报告：存在未分析及暂停，不能按全部已分析理解',counts:[10,7,4,3,2,1],metric:'比例示例：1条成立、2条不成立、1条未知；占全部会话 1/10 = 10%，占明确评估会话 1/3 = 33.3%。',run:['v2 / 暂停','已分析4 · 失败2 · 暂停1 · 跳过3','定时开关已关闭；新派发暂停，已入队任务继续。']},skipped:{notice:'已完成取数：全部未达自动门槛，仍有程序统计',counts:[10,0,0,10,0,0],metric:'AI意向和风险均未分析；不能显示0问题或全员低风险。',run:['v2 / 已完成','已分析0 · 跳过10','当日客户与员工消息未同时达到5+5。']},collecting:{notice:'取数/准入仍在处理，完整总量及符合数未知',counts:[null,null,0,0,0,0],metric:'只展示已确认部分，不将尚未扫描的客户视为无会话。',run:['v2 / 生成中','总数待确认 · 符合数待确认','尚未完成收集。']},previous:{notice:'正在显示上一可读修订v1；下方最新v2进度不加入当前指标',counts:[8,8,8,0,0,0],metric:'当前统计和下钻均基于v1的8个会话。',run:['v2 / 暂停','总数待确认 · 已分析4 · 暂停1','当前模板关闭，v2尚未完成；不改写v1。']}};function show(mode){const s=samples[mode];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('#notice').textContent=s.notice;document.querySelector('#counts').innerHTML=['纳入会话','符合分析条件','已分析','未达门槛/无法读取','失败','暂停'].map((x,i)=>'<div>'+x+'<strong>'+(s.counts[i]??'待确认')+'</strong></div>').join('');document.querySelector('#metrics').textContent=s.metric;document.querySelector('#run').innerHTML='<tr>'+s.run.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.mode));show('mixed');</script></html>
